name: Publicar portfólio no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Instalar dependências sem scripts de instalação
        run: npm ci --ignore-scripts

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Validar conteúdo
        run: npm run check

      - name: Gerar site estático
        run: npm run build

      - name: Validar segurança do código e do artefato
        run: npm run security:check

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
