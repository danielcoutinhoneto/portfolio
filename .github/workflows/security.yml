name: Verificações de segurança

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  dependency-and-build:
    name: Dependências, conteúdo e build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências sem scripts de instalação
        run: npm ci --ignore-scripts

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Validar conteúdo
        run: npm run check

      - name: Gerar site estático
        run: npm run build

      - name: Validar segurança do código e do artefato
        run: npm run security:check

  codeql:
    name: Análise estática CodeQL
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: javascript-typescript

      - name: Analisar código
        uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
